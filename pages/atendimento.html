<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Atendimento privado | Stanza Decoro</title><link rel="icon" href="/icon/favicon-32x32.png"><link rel="stylesheet" href="/assets/site.css"><link rel="stylesheet" href="/assets/atendimento.css"><script src="/assets/atendimento.js" type="module"></script></head><body><a class="skip-link" href="#main">Ir para o conteúdo</a><header class="site-header"><div class="header-inner"><a class="brand" href="/orcamento.html" aria-label="Stanza Decoro — formulário"><img src="/assets/images/stanza-logo.png" width="1182" height="669" alt="Stanza Decoro"></a><span class="eyebrow">ATENDIMENTO PRIVADO</span><button class="text-link" id="sair" type="button" hidden>Sair do atendimento</button></div></header><main id="main" class="shell atendimento-main"><section id="login"><span class="eyebrow">ACESSO DA EQUIPE</span><h1>Projetos recebidos.</h1><p>Entre com o acesso autorizado pela Stanza para consultar informações e fotos dos pedidos.</p><form id="login-form" class="quote-form" method="post" action="/pedidos-site"><fieldset id="login-fields" class="login-fields" disabled><label>E-mail<input name="email" type="email" autocomplete="username" required></label><label>Senha<input name="password" type="password" autocomplete="current-password" required></label><button class="button" type="submit">Entrar no atendimento →</button></fieldset></form><noscript><p>Ative o JavaScript para entrar no atendimento protegido.</p></noscript><p class="field-note">Ao fechar ou recarregar esta página, entre novamente.</p></section><section id="painel" hidden><div class="section-heading"><div><span id="pessoa" class="eyebrow"></span><h1>Projetos recebidos.</h1></div><button id="atualizar" class="text-link" type="button">Atualizar lista ↻</button></div><form id="pesquisa" class="atendimento-pesquisa"><label>Pesquisar protocolo<input name="protocolo" maxlength="64" placeholder="Ex.: ST-26-0001"></label><label>Situação<select name="situacao"><option value="">Todas</option><option value="novo">Novo</option><option value="em_atendimento">Em atendimento</option><option value="aguardando_cliente">Aguardando cliente</option><option value="proposta_preparada">Proposta preparada</option><option value="encerrado">Encerrado</option></select></label><button class="button" type="submit">Pesquisar</button></form><div id="lista" class="atendimento-lista"></div><button id="mais" class="text-link" type="button" hidden>Carregar mais pedidos ↓</button><article id="detalhe" class="atendimento-detalhe" tabindex="-1" hidden></article></section><p id="status" role="status">Preparando acesso protegido…</p><p id="erro" class="form-error" role="alert" hidden></p></main><dialog id="foto" class="atendimento-foto" aria-labelledby="foto-titulo"><div><h2 id="foto-titulo">Foto do projeto</h2><button id="fechar-foto" class="text-link" type="button">Fechar foto ×</button></div><img id="imagem" alt="" width="1600" height="1200"></dialog></body></html>
